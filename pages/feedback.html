<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life-X-Deen</title>
  <link rel="stylesheet" href="../styles/feedback.css" />
</head>
<body>

  <header>
    <h1>Life-X-Deen 🕋</h1>
    <p>A website to track your Ibadah </p>
  </header>

  <nav>
    <a href="home.html">Home</a>
    <a href="contact.html">Contact</a>
    <a href="feedback.html">Feedback</a>
  </nav>

  <main>
    <h2>Feedback</h2>
    <p class="feedback-message">
      We value your feedback! Please let us know if you have any suggestions, comments, or concerns about our website. Your input helps us improve and provide a better experience for all users.
    </p>

    <form class="feedback-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Submit Feedback</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Life-X-Deen</p>
  </footer>
</html>
